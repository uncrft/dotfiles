onboarding = false

[terminal]
default_shell = "nu"

[keys]
prefix = "ctrl+g"

# Pane navigation uses the Colemak-DH NEIO layout.
focus_pane_left = "prefix+n"
focus_pane_down = "prefix+e"
focus_pane_up = "prefix+i"
focus_pane_right = "prefix+o"

swap_pane_left = "prefix+shift+n"
swap_pane_down = "prefix+shift+e"
swap_pane_up = "prefix+shift+i"
swap_pane_right = "prefix+shift+o"

# Navigate mode uses the same directional layout.
navigate_pane_left = "n"
navigate_pane_down = "e"
navigate_pane_up = "i"
navigate_pane_right = "o"

cycle_pane_previous = "prefix+left"
cycle_pane_next = "prefix+right"

previous_tab = "prefix+shift+tab"
next_tab = "prefix+tab"
new_tab = "prefix+t"

new_workspace = "prefix+w"
workspace_picker = "prefix+p"
switch_tab = "prefix+shift+1..9"
switch_workspace = "prefix+1..9"

edit_scrollback = "prefix+s"
settings = "prefix+comma"

open_notification_target = "prefix+enter"

[ui]
agent_panel_sort = "spaces"
